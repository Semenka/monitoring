name: SAHIL
mdb_files:
  - data/raw/OFM_SAHIL_26032026_1_1.mdb
  - data/raw/OFM_SAHIL_26032026_2_1.mdb
gdrive_file_ids:
  - 11-2RKPnsCaLwBVu2RxP2ta-GvDzOdMGB    # _1_1 (744 MB)
  - 1MQ9rgLwrg35uOacw_NVpSDlm4-sij1pA    # _2_1 (446 MB)

tables:
  entity:
    source: ENTITIES
    columns: {entity_id: ENT_ID, name: ENT_NAME, level: ENT_TYPE, parent_id: ENT_PARENT}
  monthly:
    source: MONTHLY
    date_col: PRD_DATE
    entity_col: ENT_ID
    columns:
      oil_vol: OIL_VOL
      water_vol: WATER_VOL
      gas_vol: GAS_VOL
      wtr_inj: WTR_INJ
      gas_inj: GAS_INJ
      days_on: DAYS_ON
      bhp: null
      thp: null
  static:
    source: WELL_HEADER
    columns: {well_type: WELL_TYPE, status: STATUS, completion_date: COMP_DATE}

units: {oil_vol: bbl, water_vol: bbl, gas_vol: mscf, wtr_inj: bbl, gas_inj: mscf}
level_values: {field: FIELD, reservoir: RESERVOIR, well: WELL}
