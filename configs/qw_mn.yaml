name: QW_MN
mdb_file: data/raw/OFM_WQMN_24032026.mdb

# Auto-populated on first extraction from real OFM tables. Canonical keys are
# fixed; right-hand-side values are the real OFM column names to look up.
tables:
  entity:
    source: ENTITIES
    columns:
      entity_id: ENT_ID
      name: ENT_NAME
      level: ENT_TYPE            # FIELD / RESERVOIR / WELL
      parent_id: ENT_PARENT
  monthly:
    source: MONTHLY
    date_col: PRD_DATE
    entity_col: ENT_ID
    columns:
      oil_vol: OIL_VOL           # bbl
      water_vol: WATER_VOL       # bbl
      gas_vol: GAS_VOL           # mscf
      wtr_inj: WTR_INJ           # bbl
      gas_inj: GAS_INJ           # mscf
      days_on: DAYS_ON
      bhp: null                  # mark absent columns as null
      thp: null
  static:
    source: WELL_HEADER
    columns:
      well_type: WELL_TYPE
      status: STATUS
      completion_date: COMP_DATE

units:
  oil_vol: bbl
  water_vol: bbl
  gas_vol: mscf
  wtr_inj: bbl
  gas_inj: mscf

level_values:
